{% extends "admin/change_list.html" %}

{% block content %}

<h2>📊 Structure Dashboard</h2>

<div style="display:flex; gap:15px; margin-bottom:20px;">
    <div style="padding:10px;background:#2ecc71;color:white;border-radius:8px;">
        Total: {{ stats.total }}
    </div>

    <div style="padding:10px;background:#f39c12;color:white;border-radius:8px;">
        Pending: {{ stats.pending }}
    </div>

    <div style="padding:10px;background:#3498db;color:white;border-radius:8px;">
        Permitted: {{ stats.permitted }}
    </div>

    <div style="padding:10px;background:#e74c3c;color:white;border-radius:8px;">
        Not Permitted: {{ stats.not_permitted }}
    </div>
</div>

{{ block.super }}

{% endblock %}

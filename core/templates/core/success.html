<!DOCTYPE html>
<html>
<head>
    <title>Submission Successful</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: green;
            margin-bottom: 10px;
        }

        .ts {
            font-size: 28px;
            font-weight: bold;
            color: black;
            margin: 15px 0;
        }

        .info {
            text-align: left;
            margin-top: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎉 SUCCESS</h1>

    <p>Record has been saved successfully.</p>

    <div class="ts">
        TS NUMBER: {{ ts_id }}
    </div>

    <div class="info">
        <p><b>Owner:</b> {{ name }}</p>
        <p><b>Status:</b> Saved to system</p>
        <p><b>Next Step:</b> Continue field work</p>
    </div>

    <a class="btn" href="/core/add/step1/">➕ Add New Record</a>
    <br>
    <a class="btn" href="{% url 'dashboard' %}">🏠 Dashboard</a>

</div>

</body>
</html>

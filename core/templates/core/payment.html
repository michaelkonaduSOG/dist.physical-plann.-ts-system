<!DOCTYPE html>
<html>
<head>
    <title>Record Payment</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        .info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>💰 Record Payment</h2>

    <div class="info">
        <p><strong>TS Number:</strong> {{ structure.ts_id }}</p>
        <p><strong>Owner:</strong> {{ structure.owner_name }}</p>
        <p><strong>Status:</strong> {{ structure.permit_status }}</p>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Amount Paid (GHS)</label>
        <input type="number" name="amount" step="0.01" required>

        <label>Receipt Photo</label>
        <input type="file" name="receipt_photo" accept="image/*" capture="environment" required>

        <button type="submit">Submit for Admin Approval</button>
    </form>

</div>

</body>
</html>

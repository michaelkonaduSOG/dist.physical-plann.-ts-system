<!DOCTYPE html>
<html>
<head>
    <title>Step 2 - Owner Details</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .hint {
            font-size: 12px;
            color: gray;
            margin-top: 3px;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: black;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>👤 Step 2: Owner Information</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- OWNER NAME -->
        <label>Owner Name</label>
        <input type="text" name="owner_name" required placeholder="Full name">

        <!-- PHONE -->
        <label>Phone Number</label>
        <input type="text" name="owner_phone" required placeholder="e.g. 024XXXXXXX">
        <div class="hint">Enter valid Ghana number without country code</div>

        <!-- GHANA CARD -->
        <label>Ghana Card Number</label>
        <input type="text" name="ghana_card" id="ghana_card" required placeholder="Enter 10 digits only">
        <div class="hint">System will auto-format to GHA-XXX-XXXX-X</div>

        <!-- BUTTON -->
        <button type="submit">Next ➜ Structure Details</button>
    </form>

</div>

<script>
document.getElementById("ghana_card").addEventListener("input", function () {
    let value = this.value.replace(/\D/g, ""); // digits only
    if (value.length > 10) {
        value = value.slice(0, 10);
    }
    this.value = value;
});
</script>

</body>
</html>
